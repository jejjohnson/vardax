# ---------------------------------------------------------------------------
# mystmd builds the prose half of the documentation: home page, maths
# reference, tutorials and design docs. The API reference is built separately
# by MkDocs + mkdocstrings and mounted at `/reference/`. See `docs/README.md`.
#
# `references.api` points at a LOCAL server because mystmd only loads
# intersphinx inventories over http(s). `scripts/build_docs.py` serves the
# freshly built MkDocs `site/` on this exact port, then rewrites the resulting
# localhost URLs to the deployed `/reference/` path. Keep the port in sync
# with API_PORT in that script.
#
# The tutorials are jupytext `.py` sources (the repo forbids committed
# `.ipynb`). `scripts/build_docs.py` converts and executes each one into a
# gitignored `.ipynb` next to its source before this build reads them.
# ---------------------------------------------------------------------------
version: 1

