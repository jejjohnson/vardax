site:
  title: vardax
  template: book-theme
  options:
    logo: assets/logo-light.svg
    logo_dark: assets/logo-dark.svg
    favicon: assets/icon.svg
    # URLs follow the folder layout (design/api/models), so same-named pages in
    # different folders do not collide. mystmd still drops a leading number:
    # 05_threedvar.md is served at /threedvar/.
    folders: true
  # mystmd requires a full URL here, and the theme prepends BASE_URL to any
  # nav URL starting with `/` on hydration, so the deployed location is
  # hard-coded. A local preview's nav button therefore points at the
  # deployed site. See docs/README.md.
  nav:
    - title: API reference
      url: https://jejjohnson.github.io/vardax/reference/
