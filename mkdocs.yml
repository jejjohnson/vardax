# MkDocs builds only the API reference, from the docstrings, into site/.
# The prose half (maths reference, tutorials, design docs) is a MyST site
# under docs/myst.yml; scripts/build_docs.py builds both and mounts this one
# at /reference/. See docs/README.md.
site_name: vardax API reference
site_description: API reference for vardax, generated from Google-style docstrings.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/vardax
repo_name: jejjohnson/vardax
edit_uri: edit/main/docs/api/

docs_dir: docs/api
site_dir: site

# Links from the API pages into the prose are absolute URLs to the deployed
# MyST site, which MkDocs cannot see.
validation:
  links:
    unrecognized_links: ignore
    absolute_links: ignore

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            preload_modules: [pipekit_cycle]
            docstring_style: google
            docstring_section_style: table
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            heading_level: 3
            show_signature_annotations: true
            signature_crossrefs: true
            separate_signature: true
            merge_init_into_class: false
            filters: ["!^_"]

nav:
  - Overview: index.md
  - Models: models.md
  - Amortized Inference: amortized.md
  - Observation Operators: obs_operators.md
  - Posterior Covariance: posterior.md
  - Costs, Priors & Solvers: costs_priors.md
  - Training & Adjoints: training.md
  - Cycle Integration: cycle.md
  - Protocols & Types: protocols.md
  - Utilities & Diagnostics: utils.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jejjohnson/vardax
