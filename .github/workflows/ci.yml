name: Tests

# Test tiers (markers in pyproject.toml):
#   fast         unmarked tests, run on every OS / Python in the matrix
#   slow         tests that take over ~3 s, marked @pytest.mark.slow
#   integration  end-to-end files, marked with a module-level pytestmark
#
# Pull requests run the fast tier on the full matrix and the slow and
# integration tiers once (Ubuntu, Python 3.13). Pushes to main run every
# tier on the full matrix.
#
# Stacked pull requests: a PR whose branch has another open PR stacked on
# it skips these jobs, because the top PR's branch contains its commits
# and runs them instead (see stack-top.yml).

on:
  push:
    branches:
      - main
  pull_request:
    # `edited` re-evaluates the stack when a PR is retargeted
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stack:
    uses: ./.github/workflows/stack-top.yml

  fast:
    name: Fast tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: stack
    if: needs.stack.outputs.is-top == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      - name: Run fast tests
        run: >-
          uv run pytest tests/ -n auto -m "not slow and not integration"
          --cov=./src/vardax --cov-report=xml:./coverage.xml

      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          name: vardax
          flags: unittests
          env_vars: OS,PYTHON

  slow:
    name: Slow and integration tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    needs: stack
    if: needs.stack.outputs.is-top == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # once on pull requests, the full matrix on main
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        python-version: ${{ fromJSON(github.event_name == 'push' && '["3.12", "3.13"]' || '["3.13"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      - name: Run slow and integration tests
        run: >-
          uv run pytest tests/ -n auto -m "slow or integration"
          --cov=./src/vardax --cov-report=xml:./coverage.xml
          --cov-fail-under=0

      - name: Upload code coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          name: vardax
          flags: slow
          env_vars: OS,PYTHON
