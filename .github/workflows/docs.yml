name: Docs

# Builds the site (executing the tutorial notebooks) on every PR so a
# notebook or page that no longer builds is caught before merge.
on:
  push:
    branches:
      - main
  pull_request:
    # `edited` re-evaluates the stack when a PR is retargeted
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  stack:
    uses: ./.github/workflows/stack-top.yml

  build:
    name: Build docs
    # a stacked PR's docs are built on the top PR of its stack
    needs: stack
    if: needs.stack.outputs.is-top == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install mystmd
        run: npm install -g mystmd

      - name: Install dependencies
        run: uv sync --group docs

      # Builds the MkDocs API reference and the MyST prose site (executing the
      # tutorials), assembles them and checks every internal link.
      - name: Build and verify the documentation site (strict)
        env:
          JAX_PLATFORMS: cpu
          BASE_URL: /${{ github.event.repository.name }}
        run: uv run --group docs python scripts/build_docs.py
