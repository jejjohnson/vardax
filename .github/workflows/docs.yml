name: Docs

# Builds the site (executing the tutorial notebooks) on every PR so a
# notebook or page that no longer builds is caught before merge.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build docs (strict, executes notebooks)
        env:
          JAX_PLATFORMS: cpu
        run: uv run mkdocs build --strict
