<svg xmlns="http://www.w3.org/2000/svg" width="960" height="936" viewBox="0 0 960 936" role="img" aria-label="vardax&#x27;s areas grouped by job and their imports: the variational methods import the observation operators, the controls and the posterior; the observation operators and the posterior import the methods back; examples imports the 4DVarNet training; cycle imports nothing else from vardax, and adapters, amortized, the dynamical priors and adjoints import only the shared areas.">
